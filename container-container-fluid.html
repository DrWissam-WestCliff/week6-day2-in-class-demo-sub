<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Bootstrap Containers</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <div class="container bg-primary text-white p-4 mt-4">
    <h2>.container</h2>
    <p>
      This container has a responsive maximum width
      and is centered on larger screens.
    </p>
  </div>

  <div class="container-fluid bg-success text-white p-4 mt-4">
    <h2>.container-fluid</h2>
    <p>
      This container uses the full available width
      at every screen size.
    </p>
  </div>

</body>
</html>
